name: Publish pudding-data-story to ClawHub

on:
  push:
    branches: [main]
    paths:
      - 'skills/pudding-data-story/**'
      - '.github/workflows/publish-pudding-data-story.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      owner: tseng71
      skill_path: skills/pudding-data-story
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
