name: Publish skills to ClawHub

on:
  push:
    branches: [main]
    paths:
      - 'skills/pudding-data-story/**'
      - 'skills/image-deck/**'
      - '.github/workflows/publish-pudding-data-story.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClawHub CLI
        run: npm install --global clawhub

      - name: Authenticate ClawHub CLI
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [[ -z "${CLAWHUB_TOKEN:-}" ]]; then
            echo "CLAWHUB_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi
          clawhub --no-input login --token "$CLAWHUB_TOKEN"
          clawhub --no-input whoami

      - name: Publish image-deck
        run: |
          clawhub --no-input skill publish skills/image-deck \
            --owner tseng71 \
            --changelog "Remove generated page-number artwork and use standardized native PowerPoint slide-number fields."

      - name: Publish pudding-data-story
        run: |
          clawhub --no-input skill publish skills/pudding-data-story \
            --owner tseng71 \
            --changelog "Automated repository sync."
