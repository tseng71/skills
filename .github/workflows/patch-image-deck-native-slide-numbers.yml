name: Migrate image-deck to native slide numbers

on:
  push:
    branches:
      - agent/image-deck-native-slide-numbers
    paths:
      - 'scripts/patch-image-deck-native-slide-numbers.py'
      - 'scripts/fix-image-deck-sync-verifier.py'
      - '.github/workflows/patch-image-deck-native-slide-numbers.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Apply migration
        run: python3 scripts/patch-image-deck-native-slide-numbers.py

      - name: Fix source/plugin sync verifier
        run: python3 scripts/fix-image-deck-sync-verifier.py

      - name: Verify source/plugin sync
        run: bash scripts/verify-image-deck-sync.sh

      - name: Validate helper scripts
        run: |
          export PYTHONPYCACHEPREFIX=/tmp/image-deck-pycache
          python3 -m py_compile skills/image-deck/scripts/add_native_slide_numbers.py
          python3 -m py_compile plugins/image-deck/skills/image-deck/scripts/add_native_slide_numbers.py

      - name: Commit migrated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/image-deck plugins/image-deck scripts/sync-image-deck-local.sh scripts/verify-image-deck-sync.sh
          git add -u scripts/patch-image-deck-native-slide-numbers.py scripts/fix-image-deck-sync-verifier.py
          git diff --cached --check
          git commit -m 'Use native PowerPoint slide numbers in image-deck'
          git push origin HEAD
